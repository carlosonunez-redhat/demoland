apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  labels:
    machine.openshift.io/cluster-api-cluster: replace-me
  name: replace-me
  namespace: openshift-machine-api
spec:
  replicas: 1
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: replace-me # ${CLUSTER_ID}
      machine.openshift.io/cluster-api-machineset: replace-me # ${CLUSTER_ID}-${CLUSTER_ROLE}-${AWS_REGION}
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: replace-me # ${CLUSTER_ID}
        machine.openshift.io/cluster-api-machine-role: worker
        machine.openshift.io/cluster-api-machine-type: worker
        machine.openshift.io/cluster-api-machineset: replace-me # ${CLUSTER_ID}-${CLUSTER_ROLE}-${AWS_REGION}
    spec:
      metadata:
        labels:
          node-role.kubernetes.io/worker: ""
      providerSpec:
        value:
          ami:
            id: replace-me # $AMI_ID (use 'openshift-install coreos print-stream-json' to retrieve)
          apiVersion: awsproviderconfig.openshift.io/v1beta1
          blockDevices:
          - ebs:
              iops: 0
              volumeSize: 120
              volumeType: gp3
          credentialsSecret:
            name: aws-cloud-credentials
          deviceIndex: 0
          iamInstanceProfile:
            id: replace-me # $CLUSTER_ID-worker-profile
          instanceType: replace-me
          kind: AWSMachineProviderConfig
          placement:
            availabilityZone: replace-me
            region: replace-me
          securityGroups:
            - filters:
              - name: tag:Name
                values:
                  - replace-me # ${CLUSTER_ID}-node
          subnet:
            - filters:
              - name: tag:Name
                values:
                  - replace-me # ${CLUSTER_ID}-subnet-private-${ZONE}
          tags:
            - name: replace-me # kubernetes.io/cluster/${CLUSTER_ID}
              value: owned
          userDataSecret:
            name: worker-user-data
