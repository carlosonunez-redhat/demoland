#@ load("@ytt:data", "data")
#@ load("@ytt:base64", "base64")
apiVersion: v1
kind: Secret
metadata:
  name: auto-import-secret
  namespace: #@ data.values.cluster_name
  managedcluster-import-controller.open-cluster-management.io/keeping-auto-import-secret: ""
stringData:
  kubeconfig: #@ base64.decode(data.values.cluster_kubeconfig_encoded)
