resources:
  - ../../../../../components/k8s-namespace
  - ../../../../../components/advanced-cluster-management/resources/multicluster-observability/mco
patches:
  - target:
      kind: Namespace
      name: patch-me
    patch: |-
      - op: replace
        path: /metadata/name
        value: open-cluster-management-observability
  - target:
      kind: MultiClusterObservability
      name: observability
    patch: |-
      - op: add
        path: /spec/capabilities
        value:
          platform:
            ui:
              enabled: true
