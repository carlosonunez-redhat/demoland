resources:
  - ../../../../../components/advanced-cluster-management/resources/multiclusterhub
  - ../../../../../components/advanced-cluster-management/resources/multiclusterengine
patches:
  - target:
      kind: MultiClusterHub
      name: multiclusterhub
      namespace: openshift-cluster-management
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: advanced-cluster-management-mce
      - op: add
        path: /spec
        value:
          imagePullSecret: rh-pull-secret
  - target:
      kind: MultiClusterEngine
      name: multiclusterengine
      namespace: openshift-cluster-management
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: advanced-cluster-management-mce
