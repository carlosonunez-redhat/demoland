resources:
  - ./service-a
  - ./service-b
  - ./service-c
patches:
  - target:
      name: simple-web-server
      kind: Deployment
      namespace: service-a
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: replace-me
  - target:
      name: simple-web-server
      kind: Deployment
      namespace: service-b
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: replace-me
  - target:
      name: simple-web-server
      kind: Deployment
      namespace: service-c
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: replace-me
