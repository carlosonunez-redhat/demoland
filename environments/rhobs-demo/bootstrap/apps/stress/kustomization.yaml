namespace: example-apps
resources:
  - ../../../../../components/k8s-namespace
  - ../../../../../apps/stress-ng
patches:
  - target:
      kind: Namespace
      name: patch-me
    patch: |-
      - op: replace
        path: /metadata/name
        value: really-busy-app
  - target:
      kind: Deployment
      name: stress
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: really-busy-app
      - op: replace
        path: /spec/template/spec/containers/0/command
        value:
          - --cpu
          - 8
          - --vm
          - 4
