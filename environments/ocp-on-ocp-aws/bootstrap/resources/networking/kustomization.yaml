resources:
  - ../../../../../components/openshift-networking/resources/nmstate/bridge-network
patches:
  - target:
      kind: NodeNetworkConfigurationPolicy
      name: example-bridge-policy
    patch: |-
      - op: replace
        path: /metadata/name
        value: br1-enp127s0-policy
      - op: replace
        path: /spec/desiredState/interfaces/0/bridge/port/0/name
        value: enp126s0
